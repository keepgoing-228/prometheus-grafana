global:
  resolve_timeout: 5m

# Notifications are currently disabled (Slack was retired).
# Alerts are still visible in the Alertmanager UI (http://localhost:9093)
# and on the Host Overview dashboard's "Active Alerts" panel.
# To add a new notification channel, define a real receiver here and
# point route.receiver at it.
route:
  receiver: 'null'
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 4m
  repeat_interval: 2h

receivers:
  - name: 'null'
